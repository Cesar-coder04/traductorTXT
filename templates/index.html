<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Traductor IA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<main class="app-container">
    <!-- Cabecera principal -->
    <header class="app-header">
        <h1>Traductor IA</h1>
        <p class="subtitle">Traduce texto y genera audio de forma rápida y profesional.</p>
    </header>

    <!-- Formulario de traducción -->
    <section class="card">
        <form method="POST" class="form">
            <div class="form-row">
                <div class="form-group">
                    <label for="origen">Idioma origen</label>
                    <select name="origen" id="origen" class="select">
                        {% for codigo, info in idiomas.items() %}
                            <option value="{{codigo}}" {% if codigo == origen %}selected{% endif %}>{{info['name']}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="destino">Idioma destino</label>
                    <select name="destino" id="destino" class="select">
                        {% for codigo, info in idiomas.items() %}
                            <option value="{{codigo}}" {% if codigo == destino %}selected{% endif %}>{{info['name']}}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="texto">Texto</label>
                <textarea name="texto" id="texto" rows="5" class="textarea">{{texto}}</textarea>
            </div>

            <div class="form-actions">
                <button type="button" id="recordBtn" class="btn btn-secondary">🎙️ Grabar voz</button>
                <span id="recordStatus" class="status">(Pulsa para dictar)</span>
                <button type="submit" class="btn btn-primary">Traducir</button>
            </div>
        </form>
    </section>

    <!-- Sección de resultado: muestra el texto traducido y permite reproducirlo -->
    <section class="card output">
        <h2>Resultado</h2>
        <p id="resultado" class="output-text">{{resultado}}</p>
        <div class="output-actions">
            <button type="button" id="speakBtn" class="btn btn-secondary">🔊 Escuchar</button>
            <span id="speakStatus" class="status"></span>
        </div>
    </section>

    <footer class="app-footer">
        <small>Construido con Flask + Azure Cognitive Services.</small>
    </footer>
</main>

<!-- Script del frontend: reconocimiento, TTS y lógica de UI -->
<script>
(function() {
    const recordBtn = document.getElementById('recordBtn');
    const status = document.getElementById('recordStatus');
    const textoArea = document.getElementById('texto');
    const origenSelect = document.getElementById('origen');
    const destinoSelect = document.getElementById('destino');
    const resultadoP = document.getElementById('resultado');
    const speakBtn = document.getElementById('speakBtn');
    const speakStatus = document.getElementById('speakStatus');

    // Disable listen button when no translated result exists
    speakBtn.disabled = !resultadoP.textContent.trim();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        status.textContent = 'Este navegador no soporta reconocimiento de voz. Usa Chrome/Edge en escritorio.';
        recordBtn.disabled = true;
        return;
    }

    let recognition;
    let listening = false;

    function updateStatus(msg) {
        status.textContent = msg;
    }

    async function checkMicrophonePermission() {
        // Algunos navegadores (por ejemplo Opera) pueden bloquear el micrófono de forma silenciosa.
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            updateStatus('Este navegador no permite el acceso al micrófono. Usa Chrome/Edge en escritorio.');
            recordBtn.disabled = true;
            return false;
        }

        // Intentamos validar mediante Permissions API (si está disponible).
        if (navigator.permissions && navigator.permissions.query) {
            try {
                const result = await navigator.permissions.query({ name: 'microphone' });
                if (result.state === 'denied') {
                    updateStatus('Permiso de micrófono denegado. Actívalo en la configuración del navegador.');
                    return false;
                }
                // Si está en 'prompt' o 'granted', seguimos al siguiente chequeo.
            } catch {
                // Ignorar y continuar al fallback de getUserMedia.
            }
        }

        // Fallback: solicitamos el permiso de micrófono directamente (puede mostrar prompt).
        // Algunos navegadores (incluido Opera) pueden simplemente nunca resolver la promesa.
        const getUserMediaWithTimeout = (timeoutMs) => {
            const timeout = new Promise((_, reject) =>
                setTimeout(() => reject(new Error('timeout')), timeoutMs)
            );
            return Promise.race([
                navigator.mediaDevices.getUserMedia({ audio: true }),
                timeout,
            ]);
        };

        try {
            const stream = await getUserMediaWithTimeout(5000);
            stream.getTracks().forEach((track) => track.stop());
            return true;
        } catch (err) {
            const isTimeout = err && err.message === 'timeout';
            updateStatus(isTimeout
                ? 'No se pudo acceder al micrófono. El navegador bloquea la solicitud o no responde.'
                : 'No se pudo acceder al micrófono. Revisa los permisos del navegador.');
            recordBtn.disabled = true;
            return false;
        }
    }

    async function startRecognition() {
        updateStatus('Verificando permisos de micrófono...');
        const hasPermission = await checkMicrophonePermission();
        if (!hasPermission) return;

        recognition = new SpeechRecognition();
        recognition.lang = origenSelect.value || 'es-ES';
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            listening = true;
            recordBtn.textContent = '⏹️ Detener';
            updateStatus('Escuchando... habla ahora.');
        };

        recognition.onresult = (event) => {
            const transcript = Array.from(event.results)
                .map(r => r[0].transcript)
                .join('');

            // Reemplazar el texto con el resultado actual
            textoArea.value = transcript;
        };

        recognition.onerror = (event) => {
            const error = event.error || 'desconocido';
            if (error === 'not-allowed' || error === 'permission-denied') {
                updateStatus('Acceso al micrófono denegado. Revise la configuración de permisos del navegador.');
                recordBtn.disabled = true;
                return;
            }
            updateStatus('Error: ' + error);
        };

        recognition.onend = () => {
            listening = false;
            recordBtn.textContent = '🎙️ Grabar voz';
            updateStatus('Dictado detenido. Pulsa el botón para grabar de nuevo.');
        };

        recognition.start();
    }

    function stopRecognition() {
        if (recognition) {
            recognition.stop();
        }
    }

    recordBtn.addEventListener('click', () => {
        if (listening) {
            stopRecognition();
        } else {
            startRecognition();
        }
    });

    function updateSpeakStatus(msg) {
        speakStatus.textContent = msg;
    }

    const languageVoiceMap = {
        'es': 'es-ES',
        'en': 'en-US',
        'fr': 'fr-FR',
        'de': 'de-DE',
        'pt': 'pt-PT',
        'it': 'it-IT',
        'nl': 'nl-NL',
        'ja': 'ja-JP',
        'ko': 'ko-KR',
        'ar': 'ar-EG',
        'zh-Hans': 'zh-CN',
        'zh-Hant': 'zh-TW',
        'ru': 'ru-RU'
    };

    function getVoiceForLang(lang) {
        const voices = window.speechSynthesis.getVoices();
        if (!voices.length) {
            return null;
        }

        const normalized = lang.toLowerCase();
        const exact = voices.find(v => v.lang.toLowerCase() === normalized);
        if (exact) return exact;

        // Match by primary language (e.g., 'es' matches 'es-ES').
        const primary = normalized.split('-')[0];
        const starts = voices.find(v => v.lang.toLowerCase().startsWith(primary));
        if (starts) return starts;

        // Try matching language codes in voice.name (e.g., 'Spanish', 'Francais').
        const approx = voices.find(v => v.name.toLowerCase().includes(primary));
        if (approx) return approx;

        return voices[0];
    }

    async function playServerTTS(text, lang) {
        // Fallback server-side TTS (Azure) when browser speech synthesis fails.
        updateSpeakStatus('Generando audio...');

        try {
            const body = new URLSearchParams({ texto: text, idioma: lang });
            const res = await fetch('/tts', { method: 'POST', body });
            if (!res.ok) {
                const json = await res.json().catch(() => null);
                throw new Error(json?.error || 'Respuesta del servidor no OK');
            }

            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);

            audio.onended = () => {
                updateSpeakStatus('Reproducción finalizada.');
                URL.revokeObjectURL(url);
            };
            audio.onerror = () => {
                updateSpeakStatus('Error al reproducir el audio.');
                URL.revokeObjectURL(url);
            };

            updateSpeakStatus('Reproduciendo...');
            await audio.play();
        } catch (err) {
            updateSpeakStatus('Error al generar audio: ' + (err.message || err));
        }
    }

    function speakText(text) {
        if (!text || !text.trim()) {
            updateSpeakStatus('No hay texto para reproducir.');
            return;
        }

        const destCode = destinoSelect.value || 'es';
        const lang = languageVoiceMap[destCode] || destCode;

        if (!window.speechSynthesis) {
            updateSpeakStatus('Este navegador no soporta síntesis de voz. Usando servidor...');
            playServerTTS(text, lang);
            return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;

        const voice = getVoiceForLang(lang);
        if (voice) {
            // If the selected voice language does not match the desired primary language,
            // fall back to server TTS (more reliable for 'rare' languages).
            const desiredPrimary = (lang || '').toLowerCase().split('-')[0];
            const voicePrimary = (voice.lang || '').toLowerCase().split('-')[0];
            if (desiredPrimary && voicePrimary && desiredPrimary !== voicePrimary) {
                updateSpeakStatus('Voz local no disponible para este idioma. Usando servidor...');
                playServerTTS(text, lang);
                return;
            }

            utterance.voice = voice;
        } else {
            // If voices aren’t loaded yet, wait and retry once.
            if (!window.speechSynthesis.getVoices().length) {
                updateSpeakStatus('Cargando voces...');
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.onvoiceschanged = null;
                    speakText(text);
                };
                return;
            }

            // No voice at all: fallback to server TTS.
            updateSpeakStatus('No se encontró voz adecuada. Usando servidor...');
            playServerTTS(text, lang);
            return;
        }

        utterance.onstart = () => updateSpeakStatus('Reproduciendo...');
        utterance.onend = () => updateSpeakStatus('Reproducción finalizada.');
        utterance.onerror = () => {
            updateSpeakStatus('Error al reproducir el audio. Usando servidor...');
            playServerTTS(text, lang);
        };

        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }

    speakBtn.addEventListener('click', () => {
        const texto = resultadoP.textContent || '';
        speakText(texto);
    });
})();
</script>

</body>
</html>
